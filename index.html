<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Counter Example</title>
</head>
<body>
  <h1>Counter: <span id="counter">0</span></h1>

  <script>
    let count = 0;
    const counterElement = document.getElementById("counter");

    setInterval(() => {
      count++;
      counterElement.textContent = count;
    }, 1000); // increment every 1 second
  </script>
</body>
</html>
